<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Monomaniac+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Rock Paper Scissors</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="https://github.com/Althaf14"> <i class="fa-brands fa-github"></i></a>
    <div class="game-ui">
        <p class="user-description">Player Choice</p>
        <p class="cmptr-description">Computer Choice</p>
        <div id="result-box" class="result-box">

        </div>


        <div class="btn-div" id="btn-div">
            <div class="rock btn">
                
                <button onclick="selection('Rock')"><img src="icons/stone.png" alt="Rock"></button>
            </div>
            <div class="paper btn">
                <button onclick="selection('Paper')"><img src="icons/papper.png" alt="Paper"></button>
            </div>
            <div class="scissor btn">
                <button onclick="selection('Scissor')"><img src="icons/scissors.png" alt="Scissors"></button>
            </div>

        </div>
     

        <div class="user-display-div">
            <div id="user-display">
        
            </div>
        </div>

        <div class="cmptr-div" >

            <div class="cmptr-display-div" >
                <div id="cmptr-display">
                    
                </div>
            </div>
        </div>


    </div>
    <script src="main.js"></script>
</body>

</html>
